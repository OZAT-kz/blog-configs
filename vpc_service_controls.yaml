# vpc_service_controls.yaml
# Access Context Manager арқылы қауіпсіздік периметрін анықтау

resources:
  - accessPolicies/112233445566/servicePerimeters/fintech_prod_perimeter

servicePerimeters:
  - name: accessPolicies/112233445566/servicePerimeters/fintech_prod_perimeter
    title: FinTech Production Perimeter
    description: "API-ға сырттан кіруді бұғаттаймыз"
    status:
      restrictedServices:
        - storage.googleapis.com
        - sqladmin.googleapis.com
        - pubsub.googleapis.com
        - secretmanager.googleapis.com
      
      accessLevels:
        - accessPolicies/112233445566/accessLevels/corp_vpn_only
      
      # Күмбездің ішінде орналасқан ресурстар (жобалар)
      resources:
        - projects/fintech-prod-project

accessLevels:
  - name: accessPolicies/112233445566/accessLevels/corp_vpn_only
    title: Corporate VPN Only
    basic:
      conditions:
        - ipSubnetworks:
            - 192.0.2.0/24 # Корпоративтік VPN IP-мекенжайлары
            - 203.0.113.0/24 # Астанадағы кеңсенің IP-мекенжайлары
