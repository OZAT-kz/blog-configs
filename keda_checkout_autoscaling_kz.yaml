apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: checkout-service-scaler
  namespace: ecommerce-prod
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: checkout-service
  minReplicaCount: 20
  maxReplicaCount: 400
  cooldownPeriod: 60
  pollingInterval: 5
  advanced:
    horizontalPodAutoscalerConfig:
      behavior:
        scaleUp:
          stabilizationWindowSeconds: 0
          policies:
          - type: Percent
            value: 100
            periodSeconds: 10
          - type: Pods
            value: 50
            periodSeconds: 10
          selectPolicy: Max
        scaleDown:
          stabilizationWindowSeconds: 300
          policies:
          - type: Percent
            value: 10
            periodSeconds: 60
  triggers:
  - type: gcp-pubsub
    metadata:
      subscriptionName: projects/ozat-ecommerce/subscriptions/orders-queue-sub
      subscriptionSize: "50"